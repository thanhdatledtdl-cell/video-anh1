name: Dung video anh

on:
  # Apps Script gui su kien nay khi bam "Chay dung video" (hoac tick o H1)
  repository_dispatch:
    types: [new-video-row]
  # Cho phep bam chay tay: tab Actions > Dung video anh > Run workflow
  workflow_dispatch:

# Chi chay 1 lan tai 1 thoi diem. Cac lan gui them se xep hang cho (GitHub chi giu 1 lan dang cho),
# main.py luon quet het cac dong chua Done nen khong sot dong nao.
concurrency:
  group: dung-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cai ffmpeg va font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Cai thu vien Python
        run: pip install -r requirements.txt

      - name: Tao service_account.json tu Secret
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: printf '%s' "$GCP_SERVICE_ACCOUNT" > service_account.json

      - name: Chay main.py
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
          # Khi Apps Script gui: lay ID Sheet tu payload. Chay tay thi de trong, main.py dung SHEET_ID ghi san trong file.
          SHEET_ID: ${{ github.event.client_payload.sheet_id }}
        run: python main.py

      - name: Xoa service_account.json
        if: always()
        run: rm -f service_account.json
